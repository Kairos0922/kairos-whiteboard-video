# kairos-whiteboard-video 引擎运行环境；同步命令：cd 本目录 && uv sync
[project]
name = "kairos-whiteboard-video"
version = "0.1.0"
description = "白板叙事引擎：脚本设计 → 板图 → 标注 → 渲染 → 合成"
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless>=4.8",
    "numpy>=1.26",
    "pillow>=10.0",
    "whiteboard-video-engine",
    "edge-tts>=7.2.8",
]

[dependency-groups]
dev = ["pytest>=8.0"]

# 渲染内核 v1 已就位（scripts/whiteboard_story/kernel.py）：分区时序揭示 + 骨架描线 +
# 蛇形填色；底层渲染依赖固定到上方 Git revision，设计决策见 references/kernel-design.md。

[tool.uv]
package = false

[tool.uv.sources]
whiteboard-video-engine = { git = "https://github.com/gnipbao/whiteboard-video-engine.git", rev = "86848ea27077c1902950bf4e7e37e02d4bfbd1a3" }
